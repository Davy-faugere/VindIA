name: Application Windows

# Construit l'installeur VindIA pour Windows. Le serveur de développement tourne sous
# Linux : la compilation Windows se fait donc ici, sur un runner Windows.
#
# - Sur demande (workflow_dispatch) : l'installeur est déposé en artefact téléchargeable.
# - Sur un tag « desktop-v* » : il est en plus publié dans une Release GitHub.

on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Installeur Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Construire l'installeur
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Récupérer l'installeur
        uses: actions/upload-artifact@v4
        with:
          name: VindIA-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publier la Release (uniquement sur un tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          name: VindIA ${{ github.ref_name }}
          body: |
            Installeur Windows de VindIA.

            Téléchargez le fichier `.exe` ci-dessous et lancez-le pour installer
            l'application. Windows peut afficher un avertissement SmartScreen :
            l'installeur n'est pas signé par un certificat commercial
            (« Informations complémentaires » puis « Exécuter quand même »).
